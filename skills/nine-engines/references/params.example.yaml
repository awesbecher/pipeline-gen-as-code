# Nine Engines intake · params schema v1
#
# ILLUSTRATIVE EXAMPLE. Acme Security is a made-up company. Copy this
# file to company/params.yaml, replace every value with yours, then:
#   node engine/run.cjs company/params.yaml
# The runner validates against this schema and exits nonzero with
# field-specific errors on anything invalid. There is no fallback to
# this example unless you pass --example explicitly.
#
# Format: a strict YAML subset. key: value, one nesting level, inline
# lists [a, b], block lists (- item), comments, quoted text. Anything
# else is rejected. JSON files with the same fields also work.
#
# THE CONTRACT. Three field groups:
#   PORTFOLIO DRIVERS  deterministic engine verdicts (mix engine)
#   CAPACITY DRIVERS   the sales capacity model
#   NARRATIVE CONTEXT  carried into outputs; drives no verdict

schema_version: 1

# ---- narrative context ----
company: Acme Security
stage: seed                     # pre-seed | seed | series-a | series-b-plus
funding_usd: 8000000
arr_now_usd: 1200000
icp: Mid-market and enterprise security teams, US
personas: [CISO, VP Security Engineering, Head of AppSec]
engines_running: [manual_outbound]   # annotated on verdicts; does not change them

# ---- portfolio + capacity drivers ----
acv: 120000                     # average contract value, USD; > 0
cycle_days: 178                 # median sales cycle, whole days; > 0
cash_monthly_pipeline: 25000    # monthly pipeline budget, USD (tools,
                                # data, ads, events; not payroll)

team:
  aes_ramped: 2                 # whole numbers only
  aes_ramping: 2
  bdrs: 1                       # used by the capacity model
  gtm_engineer: true
  # Optional; when absent the model derives them and says so:
  # ses: 1
  # sales_leaders: 1
  # aes_ramping_tenure_months: [4, 3]   # one entry per ramping AE

product:
  category: AI security
  self_serve: "no"              # "yes" | "partial" | "no" (bare yes/no
                                # also accepted and normalized)
  developer_facing: false

# Hard constraints; the full vocabulary, delete lines that do not apply:
#   no_email  no_phone  no_paid_budget  no_events_budget
#   no_community_capacity  founder_wont_post
constraints: []

# ---- capacity drivers (optional block; delete to skip the model) ----
arr_target_12mo_usd: 7000000
capacity:
  base_arr_usd: 1200000         # defaults to arr_now_usd if omitted
  churn_pct: 0.06               # annual gross churn on the base, 0 to 0.6
  expansion_usd: 1000000        # expected expansion ARR, gross
